
# =============================================================================
# TMUX CONFIGURATION
# =============================================================================

# -----------------------------------------------------------------------------
# Plugin Manager Setup
# -----------------------------------------------------------------------------
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.tmux/plugins'

# Auto-install TPM if not present
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

# -----------------------------------------------------------------------------
# Plugin Declarations
# -----------------------------------------------------------------------------
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'catppuccin/tmux'
set-option -g @plugin 'tmux-plugins/tmux-cpu'
set-option -g @plugin 'tmux-plugins/tmux-yank'
set-option -g @plugin 'tmux-plugins/tmux-battery'
# Note: christoomey/vim-tmux-navigator removed in favor of smart-splits.nvim,
# which also handles seamless nvim <-> WezTerm navigation. The tmux side is
# wired up manually via @pane-is-vim bindings in the Key Bindings section.
set-option -g @plugin 'alexwforsythe/tmux-which-key'
set-option -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set-option -g @plugin 'laktak/extrakto'
set-option -g @plugin 'dreknix/tmux-primary-ip'
set-option -g @plugin 'omerxx/tmux-sessionx'
set-option -g @plugin 'YousefHadder/tmux-speedtest'
set-option -g @plugin 'YousefHadder/muslim-prayers'
set-option -g @plugin 'charlietag/tmux-split-statusbar'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'
set-option -g @plugin 'cesarferreira/tmux.expose'


# Note: tmux-net-speed plugin is Linux-only, using custom script instead

# set-option -g @plugin 'dreknix/tmux-ctp-battery'

# -----------------------------------------------------------------------------
# Plugin Configuration
# -----------------------------------------------------------------------------

# Yank Plugin
set-option -g @yank_selection_mouse 'primary'
set-option -g @yank_action 'copy-pipe'

# Catppuccin Theme
set-option -g @catppuccin_flavor 'mocha'
set-option -g @catppuccin_window_status_style 'rounded'
set-option -g @catppuccin_window_number_position 'right'
set-option -g @catppuccin_window_flags 'no'
set-option -g @catppuccin_window_text '#W'
set-option -g @catppuccin_window_current_text '#W'
set-option -g @catppuccin_window_current_text_color '#{E:@thm_surface_2}'
set-option -g @catppuccin_date_time_text '%d.%m. %H:%M'
set-option -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
set-option -g @catppuccin_status_middle_separator '▐'
set-option -g @catppuccin_battery_color '#d7875f'
# Muslim Prayers (local plugin config)
# Set coordinates and timezone in ~/.config/dotfiles-local/tmux.conf.
set-option -g @prayer-times-utc-offset 'auto'
set-option -g @prayer-times-method 'ISNA'
set-option -g @prayer-times-school 'standard'
set-option -g @prayer-times-format '12H'
set-option -g @prayer-times-interval '1'
set-option -g @prayer-times-icon '🕌'


# Continuum (auto save/restore via tmux-resurrect)
set-option -g @continuum-restore 'on'
set-option -g @continuum-save-interval '15'

# -----------------------------------------------------------------------------
# Custom Modules
# -----------------------------------------------------------------------------
# Note: Do NOT clear status-format[6] here. On config reload, format[0] is
# already split (status-left/right stripped). Clearing the backup causes the
# plugin to re-capture the split format, leaving the second status line empty.
# The backup template references status-left/right dynamically so it stays
# correct across reloads without re-capture.

run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux-battery/battery.tmux'

source -F '#{HOME}/scripts/custom_modules/ctp_cpu.conf'
source -F '#{HOME}/scripts/custom_modules/ctp_battery.conf'
source -F '#{HOME}/scripts/custom_modules/ctp_memory.conf'
source -F '#{HOME}/scripts/custom_modules/primary_ip.conf'
source -F '#{HOME}/scripts/custom_modules/ctp_net_speed.conf'
source -F '#{HOME}/scripts/custom_modules/ctp_speedtest.conf'
source -F '#{HOME}/scripts/custom_modules/ctp_prayer_times.conf'

# -----------------------------------------------------------------------------
# Status Bar Configuration
# -----------------------------------------------------------------------------
set-option -g status-justify absolute-centre
set-option -g status-position top
set-option -g status-interval 15
set-option -g status-left-length 100
set-option -g status-right-length 100

# Status Bar Content
set-option -g status-left '#{E:@catppuccin_status_session}'
set-option -ag status-left '#{E:@catppuccin_status_ctp_net_speed}'
set-option -ag status-left '#{E:@catppuccin_status_ctp_speedtest}'

set-option -gF status-right '#{E:@catppuccin_status_primary_ip}'
set-option -agF status-right '#{E:@catppuccin_status_ctp_cpu}'
set-option -agF status-right '#{E:@catppuccin_status_ctp_memory}'
set-option -agF status-right '#{E:@catppuccin_status_battery}'

# Split Statusbar Plugin
# Reset mode-setto so the plugin re-evaluates @split-statusbar-mode on reload
set-option -g @split-statusbar-mode-setto ''
set-option -g @split-statusbar-mode 'on'
set-option -g @split-statusbar-swap-lines 'off'
set-option -g @split-statusbar-bindkey '-n M-s'
set-option -g @split-status-hide-bindkey '-n M-d'

# -----------------------------------------------------------------------------
# Key Bindings
# -----------------------------------------------------------------------------

# Prefix Key
set -g prefix C-b

# Configuration Reload
unbind r
bind r source-file ~/.tmux.conf

# Creating new Session (prompts for name)
bind-key C command-prompt -p "New session name:" "new-session -s '%%'"

# Session Launcher (zoxide + fzf)
bind-key T run-shell "$HOME/scripts/tn"

# Session Navigation (creation order, matches prefix+s list)
bind-key k run-shell "$HOME/scripts/tmux-session-nav prev"
bind-key j run-shell "$HOME/scripts/tmux-session-nav next"

# Window Navigation (repeatable)
bind-key -r h previous-window
bind-key -r l next-window

# Window Reordering (move window left/right)
bind-key -r H swap-window -t -1\; select-window -t -1
bind-key -r L swap-window -t +1\; select-window -t +1

# Pane Resizing (Large increments)
bind-key -r -T prefix M-k resize-pane -U 5
bind-key -r -T prefix M-j resize-pane -D 5
bind-key -r -T prefix M-h resize-pane -L 5
bind-key -r -T prefix M-l resize-pane -R 5

# Pane Resizing (Small increments)
bind-key -r -T prefix C-k resize-pane -U
bind-key -r -T prefix C-j resize-pane -D
bind-key -r -T prefix C-h resize-pane -L
bind-key -r -T prefix C-l resize-pane -R

# Smart pane navigation (smart-splits.nvim) — seamless nvim <-> tmux panes.
# @pane-is-vim is set by smart-splits.nvim while Neovim is focused: when in
# Neovim the keys pass through (nvim moves its split, or hands off at the edge),
# otherwise tmux switches panes. Replaces christoomey/vim-tmux-navigator.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if -F "#{@pane-is-vim}" 'send-keys C-\\' 'select-pane -l'

# Same pane navigation while in copy-mode.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Window Creation
bind-key c new-window -a -c '#{pane_current_path}'

# Window Splitting
bind-key -T prefix '|' split-window -h -c '#{pane_current_path}'
bind-key -T prefix '-' split-window -v -c '#{pane_current_path}'

# Kill current session
bind-key X confirm-before -p "Kill session #S? (y/n)" kill-session

# Speedtest Plugin
set -g @speedtest_format ' #{download}  #{upload} 󰛳 #{ping}'

set-option -g @speedtest_provider 'ookla'
set-option -g @speedtest_notifications 'off'
set-option -g @speedtest_icon_idle ''
set-option -g @speedtest_timeout '120'

# Speedtest: Color-coded results
set-option -g @speedtest_colors 'on'
set-option -g @speedtest_threshold_good '100'
set-option -g @speedtest_threshold_bad '25'
set-option -g @speedtest_ping_threshold_good '30'
set-option -g @speedtest_ping_threshold_bad '100'
set-option -g @speedtest_color_good 'green'
set-option -g @speedtest_color_warn 'yellow'
set-option -g @speedtest_color_bad 'red'

# Speedtest: Auto-run
set-option -g @speedtest_run_on_start 'on'
set-option -g @speedtest_interval '30m'
# -----------------------------------------------------------------------------
# Window and Pane Options
# -----------------------------------------------------------------------------
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-rename off
set-option -g focus-events on
set-option -g detach-on-destroy off
# -----------------------------------------------------------------------------
# Terminal Configuration
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set-option -ag terminal-overrides ',xterm-256color*:RGB'
set -ga terminal-overrides ",*256col*:Tc"
set -sg escape-time 10
set -g xterm-keys on

# -----------------------------------------------------------------------------
# System Integration
# -----------------------------------------------------------------------------

# Mouse Support
set -g mouse on

# YAZI Configuration
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# OSC52 clipboard support (for neovim SSH copy)
set -g set-clipboard on

# Forward the active pane's title to the outer terminal.
# tmux defaults set-titles-string to '#W' (the window name), which drops
# any title a program inside the pane sets. '#T' is the pane title, which
# is what carries it. Needed for slk's unread indicator (e.g. "slk GH (3) +1")
# to reach Ghostty's tab/window chrome.
set -g set-titles on
set -g set-titles-string '#T'

# -----------------------------------------------------------------------------
# Initialize Plugin Manager
# -----------------------------------------------------------------------------
source-file -q ~/.config/dotfiles-work/tmux.conf
source-file -q ~/.config/dotfiles-local/tmux.conf
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
set-option -agF status-right ' #{E:@catppuccin_status_ctp_prayer_times}'
run-shell '#{TMUX_PLUGIN_MANAGER_PATH}/muslim-prayers/muslim-prayers.tmux'
